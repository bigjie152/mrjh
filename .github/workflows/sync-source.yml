name: Sync source from Codex

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository with current source
        run: |
          set -euo pipefail
          curl -fsSL "https://c85e64af.mrjh-daily-planner.pages.dev/mrjh-source.tar.gz" -o /tmp/mrjh-source.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/mrjh-source.tar.gz -C .
          rm -rf .github
          git status --short

      - name: Commit synced source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "feat: improve task planning workflow"
          git push origin HEAD:main
